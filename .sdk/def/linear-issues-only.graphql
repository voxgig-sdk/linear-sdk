"""
Linear's API is GraphQL-only (https://api.linear.app/graphql), scoped
here to the core Issue entity: read one issue, list a team's issues,
create, and update. Linear's published schema is 52,000 lines and 1,237
types; every type below is taken from it verbatim in shape, reduced to
the fields an SDK consumer of this entity actually reads.

Linear returns Float for `priority` and `number` where an Int would do,
and `dueDate` is its own TimelessDate scalar. Both are kept as Linear
declares them rather than tidied, so a generated client agrees with the
server.
"""

scalar DateTime
scalar TimelessDate

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type User {
  id: ID!
  name: String!
  email: String!
  displayName: String!
}

type Team {
  id: ID!
  name: String!
  key: String!
  description: String
}

type WorkflowState {
  id: ID!
  name: String!
  type: String!
  color: String!
}

type Issue {
  id: ID!
  identifier: String!
  number: Float!
  title: String!
  description: String
  priority: Float!
  url: String!
  branchName: String!
  estimate: Float
  dueDate: TimelessDate
  createdAt: DateTime!
  updatedAt: DateTime!
  completedAt: DateTime
  canceledAt: DateTime
  archivedAt: DateTime
  state: WorkflowState!
  team: Team!
  assignee: User
  creator: User
}

type IssueEdge {
  node: Issue!
  cursor: String!
}

type IssueConnection {
  pageInfo: PageInfo!
  edges: [IssueEdge!]!
}

type IssuePayload {
  issue: Issue
  success: Boolean!
  lastSyncId: Float!
}

input IssueCreateInput {
  teamId: String!
  title: String
  description: String
  priority: Int
  stateId: String
  assigneeId: String
}

input IssueUpdateInput {
  title: String
  description: String
  priority: Int
  stateId: String
  assigneeId: String
  teamId: String
}

type Query {
  issue(id: String!): Issue
  issues(first: Int, after: String): IssueConnection!
  team(id: String!): Team
  teams(first: Int, after: String): [Team!]!
}

type Mutation {
  issueCreate(input: IssueCreateInput!): IssuePayload!
  issueUpdate(id: String!, input: IssueUpdateInput!): IssuePayload!
}

schema {
  query: Query
  mutation: Mutation
}
